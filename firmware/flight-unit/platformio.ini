; Flight build (22 dBm). Upload: pio run -e xiao_esp32s3 -t upload
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.2
    mikalhart/TinyGPSPlus@^1.1.0

; Bench build (2 dBm) for desk tests. Upload: pio run -e bench -t upload
[env:bench]
extends = env:xiao_esp32s3
build_flags = -DRF_POWER_DBM=2
